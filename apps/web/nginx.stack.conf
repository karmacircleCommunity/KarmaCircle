# Serves the built app for the local stack. Every path that is not a file goes
# to index.html, so a deep link such as /events/beach-day opens the app, which
# then shows that page. (On Vercel the same job is done by vercel.json.)
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Built files have a hash in their name, so they never change.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The page itself must always be fetched fresh, or a new build is not seen.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri /index.html;
  }
}
