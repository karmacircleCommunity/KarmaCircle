name: 📄 Documentation issue
description: Found an issue in the documentation? You can use this one!
title: "Docs: Write a small description here"
labels: ["status: todo ⏳", "📚 docs"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description:
        Write a detailed description of the changes you are proposing.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Please add screenshots/videos if applicable
    validations:
      required: false
  - type: textarea
    id: expected-outcome
    attributes:
      label: Expected outcome
      description: What should the documentation say or help a reader do?
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List what the updated documentation must explain or enable a reader to do.
    validations:
      required: true
  - type: textarea
    id: relevant-area
    attributes:
      label: Relevant docs or files
      description: Link the documentation page or file if you know it.
    validations:
      required: false
  - type: dropdown
    id: browser
    attributes:
      label: "🥦 Browser"
      description: "What browser are you using ?"
      options:
        - Google Chrome
        - Brave
        - Microsoft Edge
        - Mozilla Firefox
        - Safari
        - Opera
        - Other
    validations:
      required: true

  - type: checkboxes
    id: no-duplicate-issues
    attributes:
      label: "Checklist ✅"
      options:
        - label:
            "I checked and didn't find similar
            [issue](https://github.com/karmacircleCommunity/KarmaCircle/issues)"
          required: true

        - label:
            "I have read the [Contributing
            Guidelines](https://github.com/karmacircleCommunity/KarmaCircle/blob/main/CONTRIBUTING.md)"
          required: true

        - label: "I am participating in Winter of Code Social (WOCS)"
          required: false

        - label: "I am willing to work on this issue (blank for no)"
          required: false

  - type: markdown
    attributes:
      value: |
        Keep project questions in this issue or the public WOCS project forum so other contributors can learn from the discussion.
        For security vulnerabilities, follow [SECURITY.md](https://github.com/karmacircleCommunity/KarmaCircle/blob/main/SECURITY.md).
