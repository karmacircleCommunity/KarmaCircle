name: 💡 Feature Request
description: Have a new idea/feature for KarmaCircle? Please suggest!
title: "Feature: Write a small description here"
labels: ["status: todo ⏳", "💡 feature"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Write a detailed description of the feature you propose.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: What needs to be done to implement this feature?
    validations:
      required: true
  - type: textarea
    id: expected-outcome
    attributes:
      label: Expected outcome
      description: What should users be able to do when this feature is complete?
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List observable conditions that define completion, including relevant edge cases.
    validations:
      required: true
  - type: textarea
    id: user-flow
    attributes:
      label: User flow, UI states, and accessibility
      description: "For user-facing work, name the primary user and describe the steps they take. Include relevant loading, empty, success, error, disabled, and permission states, plus responsive or accessibility needs. For backend-only work, write N/A."
    validations:
      required: true
  - type: textarea
    id: users-platforms
    attributes:
      label: Affected users and platforms
      description: Name affected user types and supported browsers, devices, or platforms when relevant.
    validations:
      required: false
  - type: textarea
    id: constraints-non-goals
    attributes:
      label: Constraints and non-goals
      description: Note important limits and explicitly out-of-scope behavior so the change stays focused.
    validations:
      required: false
  - type: textarea
    id: relevant-area
    attributes:
      label: Relevant app or files
      description: Mention the frontend, backend, or files involved if you know them.
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Please add screenshots/videos if applicable
    validations:
      required: false

  - type: dropdown
    id: browser
    attributes:
      label: "🥦 Browser"
      description: "What browser are you using ?"
      options:
        - Google Chrome
        - Brave
        - Microsoft Edge
        - Mozilla Firefox
        - Safari
        - Opera
        - Other
    validations:
      required: true

  - type: checkboxes
    id: no-duplicate-issues
    attributes:
      label: "Checklist ✅"
      options:
        - label:
            "I checked and didn't find similar
            [issue](https://github.com/karmacircleCommunity/KarmaCircle/issues)"
          required: true

        - label:
            "I have read the [Contributing
            Guidelines](https://github.com/karmacircleCommunity/KarmaCircle/blob/main/CONTRIBUTING.md)"
          required: true

        - label: "I am participating in Winter of Code Social (WOCS)"
          required: false

        - label: "I am willing to work on this issue (blank for no)"
          required: false

  - type: markdown
    attributes:
      value: |
        Keep project questions in this issue or the public WOCS project forum so other contributors can learn from the discussion.
        For security vulnerabilities, follow [SECURITY.md](https://github.com/karmacircleCommunity/KarmaCircle/blob/main/SECURITY.md).
