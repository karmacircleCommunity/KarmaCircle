name: Other
description: Use this for any other issues. Please do NOT create blank issues
title: "📂Other: Write a small description here"
labels: ["status: todo ⏳"]
body:
  - type: textarea
    id: issuedescription
    attributes:
      label: What would you like to share?
      description: Provide a clear and concise explanation of your issue.
    validations:
      required: true
  - type: textarea
    id: expected-outcome
    attributes:
      label: Expected outcome
      description: What response, change, or result are you asking for?
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: If this needs a code or documentation change, list observable conditions for completion.
    validations:
      required: false
  - type: textarea
    id: relevant-area
    attributes:
      label: Relevant app or files
      description: Mention the frontend, backend, or files involved if you know them.
    validations:
      required: false
  - type: dropdown
    id: browser
    attributes:
      label: "🥦 Browser"
      description: "What browser are you using ?"
      options:
        - Google Chrome
        - Brave
        - Microsoft Edge
        - Mozilla Firefox
        - Safari
        - Opera
        - Other
    validations:
      required: true

  - type: checkboxes
    id: no-duplicate-issues
    attributes:
      label: "Checklist ✅"
      options:
        - label:
            "I checked and didn't find similar
            [issue](https://github.com/karmacircleCommunity/KarmaCircle/issues)"
          required: true

        - label:
            "I have read the [Contributing
            Guidelines](https://github.com/karmacircleCommunity/KarmaCircle/blob/main/CONTRIBUTING.md)"
          required: true

        - label: "I am participating in Winter of Code Social (WOCS)"
          required: false

        - label: "I am willing to work on this issue (blank for no)"
          required: false

  - type: markdown
    attributes:
      value: |
        Keep project questions in this issue or the public WOCS project forum so other contributors can learn from the discussion.
        For security vulnerabilities, follow [SECURITY.md](https://github.com/karmacircleCommunity/KarmaCircle/blob/main/SECURITY.md).
