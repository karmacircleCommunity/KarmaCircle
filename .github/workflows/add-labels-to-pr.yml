name: 📢 Add Labels to PRs

on:
  pull_request_target:
    types:
      - opened
      - reopened

permissions: {}

jobs:
  main:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Run PR Triage Labeler
        uses: hoho4190/issue-pr-labeler@dbc51f1487125c3b5ada33bc077fc59bf3659c72 # v3.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          disable-bot: false
          config-file-name: labeler-config.yml
