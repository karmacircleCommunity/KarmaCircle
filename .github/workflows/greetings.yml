name: 🏡 Greet users

on:
  fork:
  push:
    branches: [main]
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EddieHubCommunity/gh-action-community/src/welcome@8a3d837a9a0d90f22a0d42f5722cf3d10da477cd # main, pinned 2026-11-01
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            ### Hello @${{ github.actor }}, thank you for raising the issue. </br></br>

            Currently, the issue is marked as https://github.com/karmacircleCommunity/KarmaCircle/labels/status%3A%20todo%20%E2%8F%B3 so please wait until the maintainers/owner review it and provide you with feedback/suggestions to proceed further.


            Feel free to reach out to [Tamal](https://twitter.com/tamalCodes) on **Twitter**, or drop a mail at tamalcodes@gmail.com if you think that this issue is of critical priority. </br></br>

            **Give us a ⭐ to show some support**
            **Happy OpenSource 🚀**<p></p>

          pr-message: |
            ### Hello @${{ github.actor }}, thank you for raising a pull request. </br></br>

            Currently, the pull request is marked as https://github.com/karmacircleCommunity/KarmaCircle/labels/status%3A%20todo%20%E2%8F%B3 so please wait until the maintainers/owner review it and provide you with feedback/suggestions to proceed further.

            Feel free to reach out to [Tamal](https://twitter.com/tamalCodes) on **Twitter**, or drop a mail at tamalcodes@gmail.com if you think that this pull request is of critical priority. </br></br>

            **Give us a ⭐ to show some support**
            **Happy OpenSource 🚀**<p></p>
