name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # A real Redis for the rate limit store tests (apps/api/tests/rate-limit-store.test.ts).
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.22.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails the build on a critical advisory in production dependencies.
      # Raise to `high` once zod 4 and the picomatch fix land (see S-3 in docs/events-to-do-list.md).
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level critical

      # The Go image service. Go is preinstalled on the runner and go.mod
      # names the version, so the matching toolchain is fetched if needed.
      - name: Check image service
        working-directory: apps/image-service
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
          go build ./...

      # The Go notification worker. Its tests use the Redis service above;
      # packages run one at a time because they share one Redis database.
      - name: Check notification worker
        working-directory: apps/notification-worker
        env:
          REDIS_TEST_URL: redis://localhost:6379
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race -p 1 ./...
          go build ./...

      - name: Lint apps
        run: pnpm lint

      - name: Type-check workspace
        run: pnpm type-check

      - name: Build apps
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm --filter karmacircle-frontend exec playwright install --with-deps

      - name: Run API and browser tests
        run: pnpm test
        env:
          REDIS_TEST_URL: redis://localhost:6379

      - name: Save browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failure-artifacts
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # Builds every container and starts the whole platform with the one command a
  # developer uses (`docker compose up`), then checks it answers. A separate
  # job from `validate`: it is slow and needs Docker, and a broken Dockerfile
  # should not hide the lint and test results.
  containers:
    name: containers
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the compose files
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.local.yml --profile images --profile redis --profile notifications config -q

      - name: Build the images
        run: docker compose build

      # --wait returns when every service with a health check is healthy, and
      # fails if one stops or never gets there.
      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 300

      - name: Check that everything answers
        run: |
          set -e
          curl -fsS http://localhost:5050/health
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8081/healthz
          curl -fsS http://localhost:3000/ | grep -q '<div id="root">'
          # A deep link opens the app, and a request id is echoed back.
          curl -fsS http://localhost:3000/events/anything | grep -q '<div id="root">'
          test "$(curl -fsSI -H 'X-Request-Id: ci-smoke-1' http://localhost:5050/ | tr -d '\r' | awk -F': ' 'tolower($1)=="x-request-id"{print $2}')" = "ci-smoke-1"

      - name: Show the logs if something failed
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color --tail=150

      - name: Stop the stack
        if: always()
        run: docker compose down -v
