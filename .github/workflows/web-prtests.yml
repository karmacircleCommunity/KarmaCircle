name: 👩🏻‍🚀 MAIN -> Preview Deploy (Frontend)

# SECURITY: this workflow deliberately uses `pull_request`, NOT `pull_request_target`.
# `pull_request_target` runs with base-repo secrets; combined with checking out a fork's
# code (which the Vercel action then installs and builds) it lets any fork PR exfiltrate
# VERCEL_TOKEN. Fork PRs get no secrets under `pull_request`, so they are skipped here.
# Never add `pull_request_target` + a fork checkout + secrets to this file.
# See docs/specs/security.md.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - "apps/web/**"

permissions:
  contents: read

jobs:
  Validate:
    uses: ./.github/workflows/ci.yml

  Deploy-Preview:
    # Only PRs from branches in this repo. Fork PRs never receive secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      deployments: write
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Vercel CLI
        run: npm install --global vercel@65.9.0

      - name: Deploy to Vercel Action
        uses: BetaHuhn/deploy-to-vercel-action@9893d875c782e1b4995a9399e8c4d660c33849c3 # v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DEPLOY_PR_FROM_FORK: false
          DELETE_EXISTING_COMMENT: true
          PR_LABELS: false
