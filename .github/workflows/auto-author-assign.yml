name: 📢 Add Authors to PRs

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  assign-author:
    runs-on: ubuntu-latest
    steps:
      - uses: toshimaru/auto-author-assign@eac0d15f4a55d1d1824f2b78fdea42de6cd59fef # v1.1.0
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
