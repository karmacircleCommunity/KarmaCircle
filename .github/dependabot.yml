version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
